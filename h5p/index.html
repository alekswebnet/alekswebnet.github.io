<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Page for H5P Offline Player</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, var(--bg));
        color: var(--text);
      }

      .card {
        width: min(90vw, 480px);
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 20px 45px rgba(37, 99, 235, 0.12);
        padding: 32px 28px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 2.8rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .button {
        display: inline-block;
        margin-top: 24px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello there</h1>
      <p>This is a simple page for testing the embedded H5P offline player integration.</p>

      <iframe 
        src="https://h5p-offline-player.vercel.app/embed?src=https://h5p-offline-player.vercel.app/demo/content/quiz.h5p" 
        allow="fullscreen"
        style="width: 100%; border: 0; height: 80vh">
      </iframe>
    </main>
  </body>
</html>
